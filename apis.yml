name: Truly Experiences
description: >-
  Truly Experiences is a UK-based experiential gifting company that curates and sells memorable
  experiences as gifts rather than physical products. Its catalog spans dining, spa treatments,
  drinks tastings, activities, masterclasses, travel getaways, and premium "dreams come true"
  experiences, organized by recipient, occasion, price point, and UK location (London, Edinburgh,
  Birmingham, Manchester and beyond). After checkout customers receive an e-certificate with a unique
  code, and a concierge team arranges the booking date and time. The company was surfaced as a
  portfolio company of 500 Global. As of this enrichment pass it operates a consumer e-commerce
  storefront with no public developer API, developer portal, or machine-readable API surface.
